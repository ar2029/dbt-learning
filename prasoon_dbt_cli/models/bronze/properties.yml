version: 2

models:
  - name: bronze_dim_date #  Must match the filename of a model -- including case sensitivity.
    config:
      materialized: view
      schema: bronze
  - name: bronze_dim_product
    config:
      materialized: view
    columns:
      - name: product_sk
        data_tests:
          - unique
          - not_null

  - name: bronze_fact_sales
    columns:
      - name: sales_id
        data_tests:
          - unique
          - not_null
      - name: gross_amount
        data_tests: 
          - generic_non_negative  #this is customised test which is defined in generic folder
  - name: bronze_dim_store
    columns:
      - name: store_sk
        data_tests:
          - unique
          - not_null
      - name: store_name
        data_tests:
          - accepted_values:
              arguments:
                values: ['MegaMart Manhattan', 'MegaMart Brooklyn', 'MegaMart Austin', 'MegaMart San Jose', 'MegaMart Toront']
              config:
                severity: warn